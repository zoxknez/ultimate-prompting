name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run static release gate
        run: python scripts/validate_release.py --static

      - name: Verify safe-fix sandbox
        run: python evals/sandbox.py --verify
