  Vulnerable: no Content-Security-Policy meta tag and no CSP header is set

  required baseline control, not an optional hardening extra: without it,
  any future or overlooked injection point in this renderer (a dependency
  bug, a missed encoding step) runs with unrestricted access to inline
  scripts, eval, and arbitrary remote script sources instead of being
  contained by policy.
  -->
</head>
